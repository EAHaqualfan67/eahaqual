<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAHaqual Unblocked</title>
    <!-- Essential Ultraviolet Proxy Client Scripts -->
    <script src="/uv/uv.bundle.js" defer></script>
    <script src="/uv/uv.config.js" defer></script>
    <style>
        /* Base styles matching your signature dark blue design */
        body {
            background-color: #0a0f1c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        header {
            width: 100%;
            background-color: #111827;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-area {
            margin-left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #3b82f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        nav {
            margin-right: 20px;
            display: flex;
            gap: 20px;
        }
        nav a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        nav a:hover, nav a.active {
            color: #ffffff;
            background-color: #3b82f6;
        }
        .main-container {
            max-width: 800px;
            width: 90%;
            margin-top: 50px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
        }
        /* Search Box and Proxy Layout */
        .search-section {
            background-color: rgba(15, 23, 42, 0.6);
            border-radius: 15px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .search-section h2 {
            font-size: 22px;
            margin-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .search-box-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .search-input {
            flex: 1;
            background-color: #0f172a;
            border: 2px solid #3b82f6;
            border-radius: 10px;
            padding: 15px;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            transition: box-shadow 0.3s ease;
        }
        .search-input:focus {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .go-button {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .go-button:hover {
            background-color: #2563eb;
        }
        footer {
            margin-top: auto;
            padding: 20px;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <span>🎮</span> EAHaqual <span style="font-size: 12px; background:#3b82f6; padding:2px 6px; border-radius:4px; color:white;">UNBLOCKED</span>
        </div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Games</a>
            <a href="#">Chat</a>
            <a href="#">Search</a>
        </nav>
    </header>

    <div class="main-container">
        <h1>EAHaqual Unblocked</h1>
        <p class="subtitle">Games, chat, and a whole lot more — all unblocked, all the time.</p>

        <div class="search-section">
            <h2>🔍 Search the Web</h2>
            <p style="color: #9ca3af; font-size: 14px;">Enter a URL or search term — all traffic goes through your own proxy.</p>
            
            <!-- Proxy Form connected to Ultraviolet -->
            <form id="proxy-form" class="search-box-container">
                <input type="text" id="proxy-search" class="search-input" placeholder="https://example.com or search Google..." required>
                <button type="submit" class="go-button">Go</button>
            </form>
        </div>
    </div>

    <footer>
        EAHaqual Unblocked — made for the school network 🚀
    </footer>

    <!-- Script routing for search queries and service worker registration -->
    <script>
        document.getElementById('proxy-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const input = document.getElementById('proxy-search').value.trim();
            let url = input;

            // If it is not a valid URL structure, convert it into a Google search query
            if (!/^https?:\/\//i.test(url) && !url.includes('.')) {
                url = 'https://google.com' + encodeURIComponent(input);
            } else if (!/^https?:\/\//i.test(url)) {
                url = 'http://' + url;
            }

            // Register Ultraviolet Service Worker before redirecting traffic
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('/uv.sw.js', {
                        scope: __uv$config.prefix
                    });
                    
                    // Encode url using XOR via configuration settings
                    const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
                    
                    // Route window to proxy view
                    window.location.href = encodedUrl;
                } catch (err) {
                    alert('Error connecting proxy engine: ' + err.message);
                }
            } else {
                alert('Your browser does not support Service Workers.');
            }
        });
    </script>
</body>
</html>
